name: ci

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck and the core tests. The sources run as TypeScript directly, which needs Node 22.18 or later.
  # Linux only for now: the tests build paths with URL.pathname and compare files byte for byte, which
  # fails on Windows (D:\D:\... paths, CRLF checkouts). Add windows-latest once they are portable.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The editor and <fastdraw-diagram> in a real browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # Build the site and the npm package, then install the package on Node 20 (the oldest the package
  # supports) and run it the way a user would.
  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install the package and run it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir try && cd try
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/fastdraw-*.tgz
          cp "$GITHUB_WORKSPACE/assets/example.fdraw" .
          npx fastdraw check example.fdraw
          npx fastdraw render example.fdraw
          npx fastdraw render example.fdraw -o example.svg
          test -s example.png && test -s example.svg
          npx fastdraw guide list > /dev/null
