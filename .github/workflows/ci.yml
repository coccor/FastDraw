name: ci

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck and the core tests. The sources run as TypeScript directly, which needs Node 22.18 or later.
  # Linux only for now: the tests build paths with URL.pathname and compare files byte for byte, which
  # fails on Windows (D:\D:\... paths, CRLF checkouts). Add windows-latest once they are portable.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The editor and <fastdraw-diagram> in a real browser.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # Build the site and the npm package, then install the package on Node 20 (the oldest the package
  # supports) and run it the way a user would.
  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install the package and run it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir try && cd try
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/fastdraw-*.tgz
          cp "$GITHUB_WORKSPACE/assets/example.fdraw" .
          npx fastdraw check example.fdraw
          npx fastdraw render example.fdraw
          npx fastdraw render example.fdraw -o example.svg
          test -s example.png && test -s example.svg
          npx fastdraw guide list > /dev/null

  # The Rust renderer (crates/fastdraw-render) must draw what the TypeScript draws, character for character. A
  # pull request that changes the renderer without the Rust fails here. Windows too, since FastPad builds there:
  # the checkout keeps the runner's core.autocrlf=true, and that is safe because Node and Rust read the same
  # checked-out bytes, while the generated files compared with git (data/, tests/geometry.json) are -text in
  # .gitattributes. Steps run in bash on both, so `>` writes the bytes Node prints.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          rustc --version
      - run: npm ci
      # generated files: running the generators must change nothing
      - run: npm run rust:data
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning tools/rust-cases.ts > crates/fastdraw-render/tests/geometry.json
      - run: git diff --exit-code crates/fastdraw-render
      # the TypeScript's answers for every parity case, in target/parity/; fails if the coverage fixtures miss
      # something the TypeScript reads and tests/coverage/UNCOVERED.md does not explain it
      - run: npm run rust:parity -- --coverage
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # release: the parity suite takes about half as long as in debug
      - run: cargo test --release
        env:
          FASTDRAW_PARITY_REQUIRED: '1'
      # the share links cargo test wrote, decoded with FastDraw's decodeShared
      - run: npm run rust:parity -- --check-links
      - name: Package (and its size on crates.io, under 10 MB)
        run: |
          cargo package -p fastdraw-render --list
          cargo package -p fastdraw-render
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/fastdraw-render/Cargo.toml | head -n 1)
          crate=target/package/fastdraw-render-$version.crate
          size=$(wc -c < "$crate")
          echo "$crate: $size bytes"
          if [ "$size" -gt 10000000 ]; then
            echo "::error::$crate is $size bytes, over crates.io's 10 MB limit"
            exit 1
          fi
