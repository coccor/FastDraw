name: release

# Publishes the npm package when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Publishing uses npm trusted publishing (OIDC), so there is no npm token in the repository. One-time
# setup on npmjs.com: package fastdraw > Settings > Trusted publishing > GitHub Actions, with
# repository coccor/fastdraw, workflow release.yml and environment release.
#
# The website (fastdraw.dev) is not deployed from here: Cloudflare Workers Builds deploys main.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 ships npm 11, which trusted publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Rust crate (crates/fastdraw-render), the same version as the npm package, is checked as the ci.yml rust
      # job checks it before npm publish, so a release never ships a TypeScript renderer the crate does not match.
      # The crate is not published to crates.io (Cargo.toml has publish = false); FastPad uses it from this
      # repository at a fixed commit. To publish it: remove publish = false, add a CARGO_REGISTRY_TOKEN secret to
      # the `release` environment, and add `cargo publish -p fastdraw-render --locked` (with that secret as env)
      # after npm publish, plus a token check and a `cargo publish --dry-run` before it.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: The tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/fastdraw-render/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/fastdraw-render/Cargo.toml version $version"
            exit 1
          fi
      - name: The crate's licence files equal their sources
        run: |
          cmp LICENSE crates/fastdraw-render/LICENSE
          for f in fonts/OFL-*.txt licenses/*; do cmp "$f" "crates/fastdraw-render/licenses/$(basename "$f")"; done
          for f in crates/fastdraw-render/licenses/*; do n=$(basename "$f"); test -f "fonts/$n" || test -f "licenses/$n"; done
      - run: npm run rust:data && git diff --exit-code
      - run: npm run rust:parity
      - run: cargo test --release --locked
        env:
          FASTDRAW_PARITY_REQUIRED: '1'
      - run: cargo package -p fastdraw-render --locked
      - run: npm publish --provenance --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
